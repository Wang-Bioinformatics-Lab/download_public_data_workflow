workflowname: download_public_data_workflow
workflowdescription: download_public_data_workflow
workflowlongdescription: This is the download_public_data_workflow for GNPS2
workflowversion: "2025.10.09"
workflowfile: nf_workflow.nf
workflowautohide: false
adminonly: true
#This maps the parameters from an input form to those that will appear in nextflow
parameterlist:
    - displayname: File Selection
      paramtype: section

    - displayname: Input Data Folder
      paramtype: fileselector
      nf_paramname: input_mri_file
      formplaceholder: Enter the path to data
      formvalue: ""
      targettaskfolder: input_mri_file
      optional: false
      selectsinglefile: true
      folderunroll: true

    - displayname: parallelism
      paramtype: select
      nf_paramname: parallelism
      formvalue: "10"
      options:
        - value: "1"
          display: "1"
        - value: "5"
          display: "5"
        - value: "10"
          display: "10"

    - displayname: autodownload
      paramtype: select
      nf_paramname: autodownload
      formvalue: "No"
      options:
        - value: "No"
          display: "No"
        - value: "Yes"
          display: "Yes"
        - value: "Accession"
          display: "Accession"

    - displayname: Dataset Accession(s)
      paramtype: text
      nf_paramname: dataset_accession
      formplaceholder: Enter one or more accessions, semicolon-separated (e.g. MSV000086206;MSV000086207)
      formvalue: ""
      tooltip: "Enter one or more dataset accessions separated by semicolons. All of their files are combined into a single download. Only used when autodownload is set to Accession."
      showif:
        - condition:
          - key: autodownload
            value: 'Accession'

    # Adding Dryrun Option
    - displayname: Dryrun
      paramtype: select
      nf_paramname: dryrun
      formvalue: "Yes"
      options:
        - value: "Yes"
          display: "Yes"
        - value: "No"
          display: "No"

    # Filtering prefix as dropdown
    - displayname: Filtering Prefix
      paramtype: select
      nf_paramname: filtering_prefix
      formvalue: "No"
      options:
        - value: "No"
          display: "No"
        - value: "mzspec:MSV"
          display: "mzspec:MSV"
        - value: "mzspec:NORMAN"
          display: "mzspec:NORMAN"
        - value: "mzspec:MTBLS"
          display: "mzspec:MTBLS"
        - value: "mzspec:ST"
          display: "mzspec:ST"
        

